seed: 42
tables:
  sections:
    rows: 8
    columns:
      section_id: {gen: sequence}
      section_name: {gen: choice, values: [Beverages, Condiments, Confections, Dairy, "Grains/Cereals", "Meat/Poultry", Produce, Seafood], weights: [12, 12, 12, 12, 12, 12, 12, 16]}
      summary: {gen: faker, method: sentence, null_prob: 0.3}
      graphic: {gen: const, value: null, null_prob: 1.0}

  client_profiles:
    rows: 0
    columns:
      client_type_id: {gen: sequence}
      client_text: {gen: faker, method: sentence}

  clients:
    rows: 91
    columns:
      client_id: {gen: template, format: "C{seq:04d}"}
      firm_name: {gen: faker, method: company}
      contact_person: {gen: faker, method: name, null_prob: 0.05}
      contact_designation: {gen: faker, method: word, null_prob: 0.1}
      location: {gen: faker, method: street_address, null_prob: 0.05}
      town: {gen: faker, method: city, null_prob: 0.05}
      zone: {gen: faker, method: state, null_prob: 0.1}
      zip_code: {gen: faker, method: postcode, null_prob: 0.1}
      nation: {gen: choice, values: [USA, UK, Germany, France, Spain, Italy, Brazil, Canada, Mexico, Argentina, Sweden, Norway, Denmark, Finland, Portugal, Austria, Belgium, Switzerland, Poland, Netherlands], weights: [15, 10, 10, 10, 7, 7, 6, 5, 5, 4, 3, 2, 2, 2, 2, 2, 2, 2, 2, 2], null_prob: 0.05}
      tel: {gen: faker, method: phone_number, null_prob: 0.05}
      fax_no: {gen: faker, method: phone_number, null_prob: 0.4}

  client_client_profile:
    rows: 0
    columns:
      client_id: {gen: fk}
      client_type_id: {gen: fk}

  workers:
    rows: 9
    columns:
      worker_id: {gen: sequence}
      family_name: {gen: faker, method: last_name}
      given_name: {gen: faker, method: first_name}
      designation: {gen: choice, values: ["Sales Representative", "Sales Manager", "Vice President Sales", "Inside Sales Coordinator"], weights: [60, 20, 10, 10]}
      honorific: {gen: choice, values: [Mr., Mrs., Ms., Dr.], weights: [40, 30, 20, 10], null_prob: 0.1}
      born_date: {gen: date, start: 1950-01-01, end: 1985-12-31, null_prob: 0.1}
      joined_date: {gen: date, start: 1990-01-01, end: 2010-12-31, null_prob: 0.1}
      location: {gen: faker, method: street_address, null_prob: 0.1}
      town: {gen: faker, method: city, null_prob: 0.1}
      zone: {gen: faker, method: state, null_prob: 0.1}
      zip_code: {gen: faker, method: postcode, null_prob: 0.1}
      nation: {gen: choice, values: [USA, UK, Canada], weights: [70, 20, 10], null_prob: 0.1}
      home_tel: {gen: faker, method: phone_number, null_prob: 0.1}
      ext_no: {gen: int, min: 100, max: 9999, null_prob: 0.2}
      image: {gen: const, value: null, null_prob: 1.0}
      remarks: {gen: faker, method: sentence, null_prob: 0.5}
      manager_ref: {gen: fk, ref: workers.worker_id, null_prob: 0.15}
      image_path: {gen: faker, method: uuid, null_prob: 0.5}

  zone:
    rows: 4
    columns:
      zone_id: {gen: sequence}
      zone_text: {gen: choice, values: ["North America", "Europe", "Latin America", "Asia Pacific"], weights: [25, 25, 25, 25]}

  areas:
    rows: 53
    columns:
      area_id: {gen: template, format: "AREA-{seq:04d}"}
      area_text: {gen: faker, method: city}
      zone_id: {gen: fk, ref: zone.zone_id, distribution: zipf}

  worker_areas:
    rows: 49
    columns:
      worker_id: {gen: fk, ref: workers.worker_id, distribution: zipf}
      area_id: {gen: fk, ref: areas.area_id}

  carriers:
    rows: 6
    columns:
      carrier_id: {gen: sequence}
      firm_name: {gen: choice, values: ["Federal Shipping", "Speedy Express", "United Package", "DHL Express", "FedEx Freight", "UPS Ground"], weights: [20, 20, 20, 15, 15, 10]}
      tel: {gen: faker, method: phone_number, null_prob: 0.1}

  vendors:
    rows: 29
    columns:
      vendor_id: {gen: sequence}
      firm_name: {gen: faker, method: company}
      contact_person: {gen: faker, method: name, null_prob: 0.1}
      contact_designation: {gen: faker, method: word, null_prob: 0.15}
      location: {gen: faker, method: street_address, null_prob: 0.1}
      town: {gen: faker, method: city, null_prob: 0.1}
      zone: {gen: faker, method: state, null_prob: 0.1}
      zip_code: {gen: faker, method: postcode, null_prob: 0.1}
      nation: {gen: choice, values: [USA, UK, Germany, France, Spain, Italy, Japan, Australia, Canada, Brazil], weights: [20, 15, 15, 12, 8, 8, 8, 5, 5, 4], null_prob: 0.05}
      tel: {gen: faker, method: phone_number, null_prob: 0.1}
      fax_no: {gen: faker, method: phone_number, null_prob: 0.4}
      website: {gen: faker, method: uuid, null_prob: 0.4}

  items:
    rows: 77
    columns:
      item_id: {gen: sequence}
      item_name: {gen: faker, method: catch_phrase}
      vendor_id: {gen: fk, ref: vendors.vendor_id, null_prob: 0.02}
      section_id: {gen: fk, ref: sections.section_id, null_prob: 0.02}
      qty_per_each: {gen: choice, values: ["12 - 550 ml bottles", "24 - 12 oz bottles", "48 - 6 oz jars", "12 - 200 ml jars", "36 boxes", "24 pkgs.", "12 - 1 lb pkgs.", "10 - 500 g pkgs.", "500 ml", "1 kg pkg."], weights: [12, 12, 10, 10, 10, 10, 10, 10, 8, 8], null_prob: 0.05}
      each_cost: {gen: lognormal, mu: 3.5, sigma: 1.0, round: 2, min: 2.0, max: 500.0, null_prob: 0.02}
      pieces_in_stock: {gen: int, min: 0, max: 150, null_prob: 0.05}
      pieces_on_purchase: {gen: int, min: 0, max: 100, null_prob: 0.05}
      restock_threshold: {gen: int, min: 0, max: 30, null_prob: 0.05}
      retired: {gen: choice, values: [0, 1], weights: [85, 15]}

  purchases:
    rows: 500
    columns:
      purchase_id: {gen: sequence}
      client_id: {gen: fk, ref: clients.client_id, distribution: zipf, null_prob: 0.01}
      worker_id: {gen: fk, ref: workers.worker_id, distribution: zipf, null_prob: 0.01}
      purchase_date: {gen: date, start: 2023-01-01, end: 2024-12-31}
      due_date: {gen: expr, code: "row.purchase_date + 14"}
      dispatched_date: {gen: expr, code: "row.purchase_date + 5", null_prob: 0.05}
      deliver_by: {gen: fk, ref: carriers.carrier_id, null_prob: 0.02}
      shipping_fee: {gen: float, min: 0.0, max: 200.0, round: 2, null_prob: 0.05}
      deliver_name: {gen: faker, method: company, null_prob: 0.05}
      deliver_location: {gen: faker, method: street_address, null_prob: 0.05}
      deliver_town: {gen: faker, method: city, null_prob: 0.05}
      deliver_zone: {gen: faker, method: state, null_prob: 0.1}
      deliver_zip_code: {gen: faker, method: postcode, null_prob: 0.1}
      deliver_nation: {gen: choice, values: [USA, UK, Germany, France, Spain, Italy, Brazil, Canada, Mexico, Argentina, Sweden, Norway, Denmark, Finland, Portugal, Austria, Belgium, Switzerland, Poland, Netherlands], weights: [15, 10, 10, 10, 7, 7, 6, 5, 5, 4, 3, 2, 2, 2, 2, 2, 2, 2, 2, 2], null_prob: 0.05}

  purchase_lines:
    rows: 500
    columns:
      purchase_id: {gen: fk, ref: purchases.purchase_id, distribution: zipf}
      item_id: {gen: fk, ref: items.item_id, distribution: zipf}
      each_cost: {gen: lognormal, mu: 3.5, sigma: 1.0, round: 2, min: 2.0, max: 500.0}
      qty: {gen: int, min: 1, max: 130}
      rebate: {gen: choice, values: [0.0, 0.05, 0.10, 0.15, 0.20, 0.25], weights: [40, 15, 20, 10, 10, 5]}

  state_codes:
    rows: 51
    columns:
      province_id: {gen: sequence}
      province_name: {gen: faker, method: state, null_prob: 0.0}
      province_code: {gen: template, format: "{seq:02d}"}
      province_zone: {gen: choice, values: [Northeast, Southeast, Midwest, Southwest, West], weights: [20, 20, 20, 20, 20], null_prob: 0.1}