seed: 42
tables:
  divisions:
    rows: 9
    columns:
      div_no: {gen: template, format: "D{seq:03d}"}
      div_name: {gen: faker, method: company, unique: true}

  workers:
    rows: 500
    columns:
      wkr_no: {gen: sequence}
      born_date: {gen: date, start: 1952-01-01, end: 1965-12-31}
      given_name: {gen: faker, method: first_name}
      family_name: {gen: faker, method: last_name}
      sex_code: {gen: choice, values: ['M', 'F'], weights: [50, 50]}
      joined_date: {gen: date, start: 1985-01-01, end: 2000-12-31}

  div_wkr:
    rows: 500
    columns:
      wkr_no: {gen: fk}
      div_no: {gen: fk}
      start_date: {gen: date, start: 1985-01-01, end: 2025-12-31}
      end_date: {gen: choice, values: [9999-01-01, ''], weights: [90, 10], null_prob: 0.1}

  div_lead:
    rows: 24
    columns:
      wkr_no: {gen: fk}
      div_no: {gen: fk}
      start_date: {gen: date, start: 1985-01-01, end: 2025-12-31}
      end_date: {gen: choice, values: [9999-01-01, ''], weights: [90, 10], null_prob: 0.1}

  pay_history:
    rows: 500
    columns:
      wkr_no: {gen: fk}
      pay_amount: {gen: int, min: 38000, max: 160000}
      start_date: {gen: date, start: 1985-01-01, end: 2025-12-31}
      end_date: {gen: expr, code: "new Date(row.start_date.getFullYear() + 1, row.start_date.getMonth(), row.start_date.getDate())"}

  designations:
    rows: 500
    columns:
      wkr_no: {gen: fk}
      designation: {gen: choice, values: ['Engineer', 'Senior Engineer', 'Staff', 'Senior Staff', 'Assistant Engineer', 'Technique Leader', 'Manager']}
      start_date: {gen: date, start: 1985-01-01, end: 2025-12-31}
      end_date: {gen: choice, values: [9999-01-01, ''], weights: [90, 10], null_prob: 0.1}