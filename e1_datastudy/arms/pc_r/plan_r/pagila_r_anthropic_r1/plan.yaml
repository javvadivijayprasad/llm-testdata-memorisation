seed: 42
tables:
  cast_member:
    rows: 200
    columns:
      cast_member_id: {gen: sequence}
      given_name: {gen: faker, method: first_name}
      family_name: {gen: faker, method: last_name}
      modified_on: {gen: datetime, start: 2005-01-01 00:00, end: 2023-12-31 23:59}

  nation:
    rows: 109
    columns:
      nation_id: {gen: sequence}
      nation: {gen: faker, method: city, unique: true}
      modified_on: {gen: datetime, start: 2005-01-01 00:00, end: 2023-12-31 23:59}

  town:
    rows: 500
    columns:
      town_id: {gen: sequence}
      town: {gen: faker, method: city}
      nation_id: {gen: fk, distribution: zipf}
      modified_on: {gen: datetime, start: 2005-01-01 00:00, end: 2023-12-31 23:59}

  location:
    rows: 500
    columns:
      location_id: {gen: sequence}
      location: {gen: faker, method: street_address}
      location2: {gen: faker, method: word, null_prob: 0.5}
      county: {gen: faker, method: state}
      town_id: {gen: fk, distribution: zipf}
      zip_code: {gen: faker, method: postcode, null_prob: 0.1}
      tel: {gen: faker, method: phone_number}
      modified_on: {gen: datetime, start: 2005-01-01 00:00, end: 2023-12-31 23:59}

  section:
    rows: 16
    columns:
      section_id: {gen: sequence}
      label: {gen: choice, values: [Action, Animation, Children, Classics, Comedy, Documentary, Drama, Family, Foreign, Games, Horror, Music, New, Sci-Fi, Sports, Travel]}
      modified_on: {gen: datetime, start: 2005-01-01 00:00, end: 2023-12-31 23:59}

  locale:
    rows: 6
    columns:
      locale_id: {gen: sequence}
      label: {gen: choice, values: [English, French, German, Japanese, Mandarin, Spanish]}
      modified_on: {gen: datetime, start: 2005-01-01 00:00, end: 2023-12-31 23:59}

  branch:
    rows: 2
    columns:
      branch_id: {gen: sequence}
      lead_clerk_id: {gen: int, min: 1, max: 2}
      location_id: {gen: fk}
      modified_on: {gen: datetime, start: 2005-01-01 00:00, end: 2023-12-31 23:59}

  clerk:
    rows: 2
    columns:
      clerk_id: {gen: sequence}
      given_name: {gen: faker, method: first_name}
      family_name: {gen: faker, method: last_name}
      location_id: {gen: fk}
      mail_addr: {gen: faker, method: email, null_prob: 0.1}
      branch_id: {gen: fk}
      enabled: {gen: choice, values: [true, false], weights: [95, 5]}
      login: {gen: faker, method: user_name, unique: true}
      secret: {gen: faker, method: word, null_prob: 0.1}
      modified_on: {gen: datetime, start: 2005-01-01 00:00, end: 2023-12-31 23:59}
      graphic: {gen: const, value: null, null_prob: 1.0}

  client:
    rows: 500
    columns:
      client_id: {gen: sequence}
      branch_id: {gen: fk, distribution: zipf}
      given_name: {gen: faker, method: first_name}
      family_name: {gen: faker, method: last_name}
      mail_addr: {gen: faker, method: email, null_prob: 0.1}
      location_id: {gen: fk}
      enabled_flag: {gen: choice, values: [true, false], weights: [90, 10]}
      created_date: {gen: date, start: 2005-01-01, end: 2006-12-31}
      modified_on: {gen: datetime, start: 2005-01-01 00:00, end: 2023-12-31 23:59, null_prob: 0.05}
      enabled: {gen: choice, values: [1, 0], weights: [90, 10]}

  movie:
    rows: 500
    columns:
      movie_id: {gen: sequence}
      designation: {gen: faker, method: catch_phrase}
      summary: {gen: faker, method: sentence, null_prob: 0.05}
      issued_year: {gen: int, min: 2003, max: 2008}
      locale_id: {gen: fk}
      source_locale_id: {gen: fk, null_prob: 0.3}
      loan_period: {gen: int, min: 3, max: 7}
      loan_fee: {gen: choice, values: [0.99, 2.99, 4.99], weights: [33, 34, 33]}
      runtime: {gen: int, min: 60, max: 185, null_prob: 0.05}
      replace_cost: {gen: lognormal, mu: 3.0, sigma: 0.5, round: 2, min: 9.99, max: 99.99}
      certificate: {gen: choice, values: [G, PG, PG-13, R, NC-17], weights: [10, 20, 30, 30, 10]}
      modified_on: {gen: datetime, start: 2005-01-01 00:00, end: 2023-12-31 23:59}
      extra_options: {gen: faker, method: sentence, null_prob: 0.4}

  movie_cast_member:
    rows: 500
    columns:
      cast_member_id: {gen: fk, distribution: zipf}
      movie_id: {gen: fk, distribution: zipf}
      modified_on: {gen: datetime, start: 2005-01-01 00:00, end: 2023-12-31 23:59}

  movie_section:
    rows: 500
    columns:
      movie_id: {gen: fk}
      section_id: {gen: fk}
      modified_on: {gen: datetime, start: 2005-01-01 00:00, end: 2023-12-31 23:59}

  stock:
    rows: 500
    columns:
      stock_id: {gen: sequence}
      movie_id: {gen: fk, distribution: zipf}
      branch_id: {gen: fk}
      modified_on: {gen: datetime, start: 2005-01-01 00:00, end: 2023-12-31 23:59}

  loan:
    rows: 500
    columns:
      loan_id: {gen: sequence}
      loan_date: {gen: datetime, start: 2005-05-01 00:00, end: 2006-08-31 23:59}
      stock_id: {gen: fk, distribution: zipf}
      client_id: {gen: fk, distribution: zipf}
      returned_date: {gen: expr, code: "row.loan_date + Math.floor(Math.random()*10+1) * 86400000"}
      clerk_id: {gen: fk}
      modified_on: {gen: datetime, start: 2006-01-01 00:00, end: 2023-12-31 23:59}

  receipt:
    rows: 500
    columns:
      receipt_id: {gen: sequence}
      client_id: {gen: fk, ref: client.client_id, distribution: zipf}
      clerk_id: {gen: fk, ref: clerk.clerk_id}
      loan_id: {gen: fk, ref: loan.loan_id}
      value_paid: {gen: choice, values: [0.99, 2.99, 4.99, 5.99, 7.99], weights: [20, 35, 30, 10, 5]}
      receipt_date: {gen: datetime, start: 2005-05-02 00:00, end: 2006-09-30 23:59}