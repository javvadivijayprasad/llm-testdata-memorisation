seed: 42
tables:
  divisions:
    rows: 9
    columns:
      div_no: {gen: template, format: "D{seq:03d}"}
      div_name: {gen: faker, method: word, unique: true}

  workers:
    rows: 500
    columns:
      wkr_no: {gen: sequence}
      born_date: {gen: date, start: 1952-01-01, end: 1965-12-31}
      given_name: {gen: faker, method: first_name}
      family_name: {gen: faker, method: last_name}
      sex_code: {gen: choice, values: [M, F], weights: [60, 40]}
      joined_date: {gen: date, start: 1985-01-01, end: 2000-12-31}

  div_wkr:
    rows: 500
    columns:
      wkr_no: {gen: fk, ref: workers.wkr_no}
      div_no: {gen: fk, ref: divisions.div_no}
      start_date: {gen: date, start: 1985-01-01, end: 2000-12-31}
      end_date: {gen: choice, values: ["9999-01-01", "2005-01-01"], weights: [80, 20]}

  div_lead:
    rows: 24
    columns:
      wkr_no: {gen: fk, ref: workers.wkr_no}
      div_no: {gen: fk, ref: divisions.div_no}
      start_date: {gen: date, start: 1985-01-01, end: 2000-12-31}
      end_date: {gen: expr, code: "row.start_date < '2000-01-01' ? '2005-01-01' : '9999-01-01'"}

  pay_history:
    rows: 500
    columns:
      wkr_no: {gen: fk, ref: workers.wkr_no}
      pay_amount: {gen: int, min: 38000, max: 160000}
      start_date: {gen: date, start: 1985-01-01, end: 2000-12-31}
      end_date: {gen: expr, code: "row.start_date"}

  designations:
    rows: 500
    columns:
      wkr_no: {gen: fk, ref: workers.wkr_no}
      designation: {gen: choice, values: [Engineer, "Senior Engineer", Staff, "Senior Staff", "Assistant Engineer", "Technique Leader", Manager], weights: [30, 20, 15, 10, 10, 10, 5]}
      start_date: {gen: date, start: 1985-01-01, end: 2000-12-31}
      end_date: {gen: date, start: 2001-01-01, end: 2024-12-31, null_prob: 0.2}