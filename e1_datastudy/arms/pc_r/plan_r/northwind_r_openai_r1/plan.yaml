seed: 42
tables:
  sections:
    rows: 8
    columns:
      section_id: {gen: sequence}
      section_name: {gen: choice, values: [beverages, condiments, confections, dairy, grains/cereals, meat/poultry, produce, seafood]}
      summary: {gen: faker, method: sentence, null_prob: 0.3}
      graphic: {gen: const, value: null, null_prob: 0.8}

  client_profiles:
    rows: 0
    columns:
      client_type_id: {gen: sequence}
      client_text: {gen: faker, method: sentence}

  clients:
    rows: 91
    columns:
      client_id: {gen: template, format: "C-{seq:03d}"}
      firm_name: {gen: faker, method: company}
      contact_person: {gen: faker, method: name, null_prob: 0.2}
      contact_designation: {gen: faker, method: job_title, null_prob: 0.2}
      location: {gen: faker, method: street_address}
      town: {gen: faker, method: city}
      zone: {gen: faker, method: state}
      zip_code: {gen: faker, method: postcode}
      nation: {gen: choice, values: ["USA", "Canada", "UK", "Germany", "France", "Italy", "Spain", "Netherlands", "Mexico", "Brazil"]}
      tel: {gen: faker, method: phone_number}
      fax_no: {gen: faker, method: phone_number, null_prob: 0.5}

  client_client_profile:
    rows: 0
    columns:
      client_id: {gen: fk, ref: clients.client_id}
      client_type_id: {gen: fk, ref: client_profiles.client_type_id}

  workers:
    rows: 9
    columns:
      worker_id: {gen: sequence}
      family_name: {gen: faker, method: last_name}
      given_name: {gen: faker, method: first_name}
      designation: {gen: faker, method: job_title, null_prob: 0.1}
      honorific: {gen: choice, values: ["Mr.", "Ms.", "Mrs.", "Dr."], null_prob: 0.3}
      born_date: {gen: date, start: 1960-01-01, end: 1995-12-31}
      joined_date: {gen: date, start: 2010-01-01, end: 2023-01-01}
      location: {gen: faker, method: street_address}
      town: {gen: faker, method: city}
      zone: {gen: faker, method: state}
      zip_code: {gen: faker, method: postcode}
      nation: {gen: choice, values: ["USA", "Canada", "UK", "Germany", "France", "Italy", "Spain", "Netherlands", "Mexico", "Brazil"]}
      home_tel: {gen: faker, method: phone_number}
      ext_no: {gen: faker, method: user_name, null_prob: 0.5}
      image: {gen: const, value: null, null_prob: 0.9}
      remarks: {gen: faker, method: sentence, null_prob: 0.7}
      manager_ref: {gen: fk, ref: workers.worker_id, null_prob: 0.2}
      image_path: {gen: const, value: null, null_prob: 0.9}

  zone:
    rows: 4
    columns:
      zone_id: {gen: sequence}
      zone_text: {gen: faker, method: word}

  areas:
    rows: 53
    columns:
      area_id: {gen: template, format: "A-{seq:03d}"}
      area_text: {gen: faker, method: word}
      zone_id: {gen: fk, ref: zone.zone_id}

  worker_areas:
    rows: 49
    columns:
      worker_id: {gen: fk, ref: workers.worker_id}
      area_id: {gen: fk, ref: areas.area_id}

  carriers:
    rows: 6
    columns:
      carrier_id: {gen: sequence}
      firm_name: {gen: faker, method: company}
      tel: {gen: faker, method: phone_number}

  purchases:
    rows: 500
    columns:
      purchase_id: {gen: sequence}
      client_id: {gen: fk, ref: clients.client_id}
      worker_id: {gen: fk, ref: workers.worker_id}
      purchase_date: {gen: date, start: 2021-01-01, end: 2022-12-31}
      due_date: {gen: expr, code: "new Date(row.purchase_date.getTime() + 7*24*60*60*1000)"}
      dispatched_date: {gen: expr, code: "new Date(row.purchase_date.getTime() + 3*24*60*60*1000)", null_prob: 0.1}
      deliver_by: {gen: fk, ref: carriers.carrier_id}
      shipping_fee: {gen: float, min: 5.0, max: 50.0, round: 2}
      deliver_name: {gen: faker, method: name}
      deliver_location: {gen: faker, method: street_address}
      deliver_town: {gen: faker, method: city}
      deliver_zone: {gen: faker, method: state}
      deliver_zip_code: {gen: faker, method: postcode}
      deliver_nation: {gen: choice, values: ["USA", "Canada", "UK", "Germany", "France", "Italy", "Spain", "Netherlands", "Mexico", "Brazil"]}

  vendors:
    rows: 29
    columns:
      vendor_id: {gen: sequence}
      firm_name: {gen: faker, method: company}
      contact_person: {gen: faker, method: name, null_prob: 0.2}
      contact_designation: {gen: faker, method: job_title, null_prob: 0.2}
      location: {gen: faker, method: street_address}
      town: {gen: faker, method: city}
      zone: {gen: faker, method: state}
      zip_code: {gen: faker, method: postcode}
      nation: {gen: choice, values: ["USA", "Canada", "UK", "Germany", "France", "Italy", "Spain", "Netherlands", "Mexico", "Brazil"]}
      tel: {gen: faker, method: phone_number}
      fax_no: {gen: faker, method: phone_number, null_prob: 0.5}
      website: {gen: faker, method: word, null_prob: 0.3}

  items:
    rows: 77
    columns:
      item_id: {gen: sequence}
      item_name: {gen: faker, method: word}
      vendor_id: {gen: fk, ref: vendors.vendor_id}
      section_id: {gen: fk, ref: sections.section_id}
      qty_per_each: {gen: faker, method: word}
      each_cost: {gen: float, min: 1.0, max: 100.0, round: 2}
      pieces_in_stock: {gen: int, min: 0, max: 1000}
      pieces_on_purchase: {gen: int, min: 0, max: 500}
      restock_threshold: {gen: int, min: 10, max: 100}
      retired: {gen: choice, values: [0, 1], weights: [90, 10]}

  purchase_lines:
    rows: 500
    columns:
      purchase_id: {gen: fk, ref: purchases.purchase_id}
      item_id: {gen: fk, ref: items.item_id}
      each_cost: {gen: fk, ref: items.each_cost}
      qty: {gen: int, min: 1, max: 100}
      rebate: {gen: float, min: 0.0, max: 25.0, round: 2}

  state_codes:
    rows: 51
    columns:
      province_id: {gen: sequence}
      province_name: {gen: faker, method: state}
      province_code: {gen: faker, method: state_abbr}
      province_zone: {gen: faker, method: word}