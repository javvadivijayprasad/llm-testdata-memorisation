seed: 42
tables:
  sections:
    rows: 16
    columns:
      section: {gen: sequence}
      section_label: {gen: choice, values: [Action, Animation, Children, Classics, Comedy, Documentary, Drama, Family, Foreign, Games, Horror, Music, New, Sci-Fi, Sports, Travel], weights: [7, 5, 5, 6, 7, 5, 8, 6, 5, 4, 6, 4, 6, 6, 5, 5]}

  clients:
    rows: 500
    columns:
      client_id: {gen: sequence}
      given_name: {gen: faker, method: first_name}
      family_name: {gen: faker, method: last_name}
      location1: {gen: faker, method: street_address}
      location2: {gen: faker, method: word, null_prob: 0.4}
      town: {gen: faker, method: city}
      province: {gen: faker, method: state, null_prob: 0.3}
      postcode: {gen: int, min: 10000, max: 99999, null_prob: 0.3}
      nation: {gen: choice, values: [United States, Canada, United Kingdom, Australia, Germany, France, Japan, Brazil, Mexico, India], weights: [50, 8, 8, 6, 6, 6, 4, 4, 4, 4]}
      zone: {gen: choice, values: [1, 2], weights: [50, 50]}
      mail_addr: {gen: faker, method: email, null_prob: 0.1}
      tel: {gen: faker, method: phone_number, null_prob: 0.1}
      card_type: {gen: choice, values: [1, 2, 3, 4], weights: [40, 30, 20, 10]}
      card_no: {gen: template, format: "{seq:016d}"}
      card_expiry: {gen: choice, values: ["12/26", "06/26", "03/27", "09/27", "01/28", "07/28"], weights: [20, 20, 15, 15, 15, 15]}
      login: {gen: faker, method: user_name, unique: true}
      secret: {gen: faker, method: uuid}
      years_old: {gen: int, min: 18, max: 80, null_prob: 0.1}
      earnings: {gen: int, min: 15000, max: 250000, null_prob: 0.2}
      sex_code: {gen: choice, values: [M, F], weights: [50, 50], null_prob: 0.05}

  stock:
    rows: 500
    columns:
      item_id: {gen: sequence}
      qty_in_stock: {gen: int, min: 0, max: 500}
      sold_count: {gen: int, min: 0, max: 10000}

  items:
    rows: 500
    columns:
      item_id: {gen: sequence}
      section: {gen: fk, ref: sections.section}
      designation: {gen: faker, method: catch_phrase}
      cast_member: {gen: faker, method: name}
      cost: {gen: float, min: 9.99, max: 29.99, round: 2}
      extra: {gen: choice, values: [0, 1], weights: [70, 30], null_prob: 0.05}
      related_item_id: {gen: int, min: 1, max: 500}

  purchases:
    rows: 500
    columns:
      purchase_id: {gen: sequence}
      purchase_date: {gen: date, start: 2024-01-01, end: 2024-12-31}
      client_id: {gen: fk, ref: clients.client_id, distribution: zipf, null_prob: 0.05}
      net_value: {gen: float, min: 9.99, max: 299.99, round: 2}
      levy: {gen: expr, code: "Math.round(row.net_value * 0.08 * 100) / 100"}
      gross_value: {gen: expr, code: "Math.round((row.net_value + row.levy) * 100) / 100"}

  purchase_lines:
    rows: 500
    columns:
      purchase_line_id: {gen: sequence}
      purchase_id: {gen: fk, ref: purchases.purchase_id, distribution: zipf}
      item_id: {gen: fk, ref: stock.item_id}
      qty: {gen: int, min: 1, max: 5}
      purchase_date: {gen: date, start: 2024-01-01, end: 2024-12-31}

  cli_history:
    rows: 500
    columns:
      client_id: {gen: fk, ref: clients.client_id, distribution: zipf}
      purchase_id: {gen: fk, ref: purchases.purchase_id}
      item_id: {gen: fk, ref: stock.item_id}

  restock:
    rows: 0
    columns:
      item_id: {gen: fk, ref: stock.item_id}
      date_minimum: {gen: date, start: 2024-01-01, end: 2024-12-31}
      qty_minimum: {gen: int, min: 1, max: 100}
      date_restocked: {gen: date, start: 2024-01-01, end: 2024-12-31, null_prob: 0.5}
      qty_restocked: {gen: int, min: 1, max: 200, null_prob: 0.5}
      date_anticipated: {gen: date, start: 2024-01-01, end: 2025-06-30, null_prob: 0.3}