seed: 42
tables:
  departments:
    rows: 9
    columns:
      dept_no: {gen: template, format: "DPT-{seq:02d}"}
      dept_name: {gen: faker, method: company, unique: true}

  employees:
    rows: 500
    columns:
      emp_no: {gen: sequence}
      birth_date: {gen: date, start: 1952-01-01, end: 1965-12-31}
      first_name: {gen: faker, method: first_name}
      last_name: {gen: faker, method: last_name}
      gender: {gen: choice, values: ['M', 'F'], weights: [50, 50]}
      hire_date: {gen: date, start: 1985-01-01, end: 2000-12-31}

  dept_emp:
    rows: 500
    columns:
      emp_no: {gen: fk}
      dept_no: {gen: fk}
      from_date: {gen: date, start: 1985-01-01, end: 2025-12-31}
      to_date: {gen: expr, code: "row.from_date < '2025-12-31' ? '9999-01-01' : row.from_date"}

  dept_manager:
    rows: 24
    columns:
      emp_no: {gen: fk}
      dept_no: {gen: fk}
      from_date: {gen: date, start: 1985-01-01, end: 2025-12-31}
      to_date: {gen: expr, code: "row.from_date < '2025-12-31' ? '9999-01-01' : row.from_date"}

  salaries:
    rows: 500
    columns:
      emp_no: {gen: fk}
      salary: {gen: int, min: 38000, max: 160000}
      from_date: {gen: date, start: 1985-01-01, end: 2025-12-31}
      to_date: {gen: expr, code: "new Date(row.from_date).getFullYear() + 1 + '-01-01'"}

  titles:
    rows: 500
    columns:
      emp_no: {gen: fk}
      title: {gen: choice, values: ['Engineer', 'Senior Engineer', 'Staff', 'Senior Staff', 'Assistant Engineer', 'Technique Leader', 'Manager']}
      from_date: {gen: date, start: 1985-01-01, end: 2025-12-31}
      to_date: {gen: expr, code: "row.from_date < '2025-12-31' ? '9999-01-01' : row.from_date"}