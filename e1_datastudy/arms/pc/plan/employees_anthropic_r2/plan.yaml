seed: 42
tables:
  departments:
    rows: 9
    columns:
      dept_no: {gen: template, format: "d{seq:03d}"}
      dept_name: {gen: choice, values: ["Marketing", "Finance", "Human Resources", "Production", "Development", "Quality Management", "Sales", "Research", "Customer Service"]}

  employees:
    rows: 500
    columns:
      emp_no: {gen: sequence}
      birth_date: {gen: date, start: 1952-01-01, end: 1965-12-31}
      first_name: {gen: faker, method: first_name}
      last_name: {gen: faker, method: last_name}
      gender: {gen: choice, values: ["M", "F"], weights: [60, 40]}
      hire_date: {gen: date, start: 1985-01-01, end: 2000-12-31}

  dept_emp:
    rows: 500
    columns:
      emp_no: {gen: fk, ref: employees.emp_no}
      dept_no: {gen: fk, ref: departments.dept_no}
      from_date: {gen: date, start: 1985-01-01, end: 2000-12-31}
      to_date: {gen: const, value: "9999-01-01"}

  dept_manager:
    rows: 24
    columns:
      emp_no: {gen: fk, ref: employees.emp_no}
      dept_no: {gen: fk, ref: departments.dept_no}
      from_date: {gen: date, start: 1985-01-01, end: 2000-12-31}
      to_date: {gen: const, value: "9999-01-01"}

  salaries:
    rows: 500
    columns:
      emp_no: {gen: fk, ref: employees.emp_no}
      salary: {gen: int, min: 38000, max: 160000}
      from_date: {gen: date, start: 1985-01-01, end: 2000-12-31}
      to_date: {gen: expr, code: "new Date(new Date(row.from_date).setFullYear(new Date(row.from_date).getFullYear() + 1)).toISOString().slice(0,10)"}

  titles:
    rows: 500
    columns:
      emp_no: {gen: fk, ref: employees.emp_no}
      title: {gen: choice, values: ["Engineer", "Senior Engineer", "Staff", "Senior Staff", "Assistant Engineer", "Technique Leader", "Manager"], weights: [25, 25, 15, 15, 10, 7, 3]}
      from_date: {gen: date, start: 1985-01-01, end: 2000-12-31}
      to_date: {gen: const, value: "9999-01-01", null_prob: 0.1}