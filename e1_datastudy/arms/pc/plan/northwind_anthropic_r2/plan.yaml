seed: 42
tables:
  categories:
    rows: 8
    columns:
      category_id: {gen: sequence}
      category_name: {gen: choice, values: [Beverages, Condiments, Confections, Dairy, "Grains/Cereals", "Meat/Poultry", Produce, Seafood], weights: [12, 12, 12, 12, 12, 12, 12, 12]}
      description: {gen: faker, method: sentence}
      picture: {gen: const, value: null, null_prob: 1.0}

  customer_demographics:
    rows: 0
    columns:
      customer_type_id: {gen: sequence}
      customer_desc: {gen: faker, method: sentence}

  customers:
    rows: 91
    columns:
      customer_id: {gen: template, format: "C{seq:04d}", unique: true}
      company_name: {gen: faker, method: company}
      contact_name: {gen: faker, method: name, null_prob: 0.02}
      contact_title: {gen: choice, values: ["Sales Representative", "Owner", "Sales Manager", "Marketing Manager", "Accounting Manager", "Sales Agent", "Marketing Representative", "Order Administrator"], weights: [30, 20, 15, 10, 10, 7, 5, 3], null_prob: 0.02}
      address: {gen: faker, method: street_address, null_prob: 0.02}
      city: {gen: faker, method: city, null_prob: 0.02}
      region: {gen: faker, method: state, null_prob: 0.4}
      postal_code: {gen: faker, method: postcode, null_prob: 0.05}
      country: {gen: choice, values: [Germany, UK, France, Spain, Italy, USA, Canada, Brazil, Argentina, Mexico, Sweden, Norway, Denmark, Finland, Austria, Switzerland, Belgium, Portugal, Poland], weights: [14, 12, 11, 7, 7, 8, 4, 5, 4, 4, 3, 2, 2, 2, 3, 3, 2, 2, 3], null_prob: 0.01}
      phone: {gen: faker, method: phone_number, null_prob: 0.02}
      fax: {gen: faker, method: phone_number, null_prob: 0.35}

  customer_customer_demo:
    rows: 0
    columns:
      customer_id: {gen: fk}
      customer_type_id: {gen: fk}

  employees:
    rows: 9
    columns:
      employee_id: {gen: sequence}
      last_name: {gen: faker, method: last_name}
      first_name: {gen: faker, method: first_name}
      title: {gen: choice, values: ["Sales Representative", "Sales Manager", "Vice President, Sales", "Inside Sales Coordinator"], weights: [55, 22, 11, 12]}
      title_of_courtesy: {gen: choice, values: [Mr., Mrs., Ms., Dr.], weights: [40, 25, 25, 10], null_prob: 0.05}
      birth_date: {gen: date, start: 1940-01-01, end: 1975-12-31, null_prob: 0.0}
      hire_date: {gen: date, start: 1992-01-01, end: 1997-12-31, null_prob: 0.0}
      address: {gen: faker, method: street_address, null_prob: 0.05}
      city: {gen: faker, method: city, null_prob: 0.05}
      region: {gen: faker, method: state, null_prob: 0.5}
      postal_code: {gen: faker, method: postcode, null_prob: 0.05}
      country: {gen: choice, values: [USA, UK], weights: [70, 30], null_prob: 0.0}
      home_phone: {gen: faker, method: phone_number, null_prob: 0.05}
      extension: {gen: int, min: 100, max: 9999, null_prob: 0.05}
      photo: {gen: const, value: null, null_prob: 1.0}
      notes: {gen: faker, method: sentence, null_prob: 0.1}
      reports_to: {gen: int, min: 1, max: 1, null_prob: 0.11}
      photo_path: {gen: faker, method: word, null_prob: 0.1}

  region:
    rows: 4
    columns:
      region_id: {gen: sequence}
      region_description: {gen: choice, values: ["Eastern", "Western", "Northern", "Southern"], weights: [25, 25, 25, 25]}

  territories:
    rows: 53
    columns:
      territory_id: {gen: template, format: "T{seq:05d}", unique: true}
      territory_description: {gen: faker, method: city}
      region_id: {gen: fk}

  employee_territories:
    rows: 49
    columns:
      employee_id: {gen: fk, distribution: zipf}
      territory_id: {gen: fk}

  shippers:
    rows: 6
    columns:
      shipper_id: {gen: sequence}
      company_name: {gen: faker, method: company}
      phone: {gen: faker, method: phone_number, null_prob: 0.05}

  suppliers:
    rows: 29
    columns:
      supplier_id: {gen: sequence}
      company_name: {gen: faker, method: company}
      contact_name: {gen: faker, method: name, null_prob: 0.05}
      contact_title: {gen: choice, values: ["Sales Representative", "Owner", "Marketing Manager", "Sales Manager", "Export Administrator", "Purchasing Manager"], weights: [25, 20, 15, 15, 15, 10], null_prob: 0.05}
      address: {gen: faker, method: street_address, null_prob: 0.05}
      city: {gen: faker, method: city, null_prob: 0.05}
      region: {gen: faker, method: state, null_prob: 0.45}
      postal_code: {gen: faker, method: postcode, null_prob: 0.05}
      country: {gen: choice, values: [USA, UK, Germany, France, Japan, Australia, Sweden, Norway, Denmark, Finland, Canada, Brazil, Singapore, Netherlands, Italy, Spain], weights: [12, 10, 10, 9, 8, 6, 6, 5, 5, 5, 5, 4, 4, 4, 4, 3], null_prob: 0.02}
      phone: {gen: faker, method: phone_number, null_prob: 0.05}
      fax: {gen: faker, method: phone_number, null_prob: 0.35}
      homepage: {gen: faker, method: word, null_prob: 0.6}

  products:
    rows: 77
    columns:
      product_id: {gen: sequence}
      product_name: {gen: faker, method: catch_phrase, unique: true}
      supplier_id: {gen: fk, null_prob: 0.02}
      category_id: {gen: fk, null_prob: 0.02}
      quantity_per_unit: {gen: choice, values: ["10 boxes x 20 bags", "24 - 12 oz bottles", "12 - 550 ml bottles", "48 - 6 oz jars", "36 boxes", "12 - 8 oz jars", "1 kg pkg.", "500 g", "24 pkgs. x 4 pieces", "4 - 450 g glasses"], weights: [12, 12, 10, 10, 10, 10, 10, 9, 9, 8], null_prob: 0.02}
      unit_price: {gen: lognormal, mu: 3.2, sigma: 0.9, round: 2, min: 2.0, max: 300.0, null_prob: 0.02}
      units_in_stock: {gen: int, min: 0, max: 125, null_prob: 0.02}
      units_on_order: {gen: int, min: 0, max: 100, null_prob: 0.02}
      reorder_level: {gen: int, min: 0, max: 30, null_prob: 0.02}
      discontinued: {gen: choice, values: [0, 1], weights: [87, 13]}

  orders:
    rows: 500
    columns:
      order_id: {gen: sequence}
      customer_id: {gen: fk, distribution: zipf, null_prob: 0.01}
      employee_id: {gen: fk, distribution: zipf, null_prob: 0.01}
      order_date: {gen: date, start: 1996-07-01, end: 1998-05-01}
      required_date: {gen: expr, code: "new Date(new Date(row.order_date).getTime() + (14 + Math.floor(Math.random()*14))*86400000).toISOString().slice(0,10)"}
      shipped_date: {gen: expr, code: "Math.random() < 0.05 ? null : new Date(new Date(row.order_date).getTime() + (2 + Math.floor(Math.random()*10))*86400000).toISOString().slice(0,10)", null_prob: 0.05}
      ship_via: {gen: fk, null_prob: 0.01}
      freight: {gen: float, min: 0.5, max: 890.0, round: 2, null_prob: 0.02}
      ship_name: {gen: faker, method: company, null_prob: 0.02}
      ship_address: {gen: faker, method: street_address, null_prob: 0.02}
      ship_city: {gen: faker, method: city, null_prob: 0.02}
      ship_region: {gen: faker, method: state, null_prob: 0.4}
      ship_postal_code: {gen: faker, method: postcode, null_prob: 0.05}
      ship_country: {gen: choice, values: [Germany, UK, France, Spain, Italy, USA, Canada, Brazil, Argentina, Mexico, Sweden, Norway, Denmark, Finland, Austria, Switzerland, Belgium, Portugal, Poland], weights: [14, 12, 11, 7, 7, 8, 4, 5, 4, 4, 3, 2, 2, 2, 3, 3, 2, 2, 3], null_prob: 0.02}

  order_details:
    rows: 500
    columns:
      order_id: {gen: fk, ref: orders.order_id, distribution: zipf}
      product_id: {gen: fk, ref: products.product_id, distribution: zipf}
      unit_price: {gen: lognormal, mu: 3.2, sigma: 0.9, round: 2, min: 2.0, max: 300.0}
      quantity: {gen: int, min: 1, max: 130}
      discount: {gen: choice, values: [0.0, 0.05, 0.10, 0.15, 0.20, 0.25], weights: [55, 12, 12, 10, 6, 5]}

  us_states:
    rows: 51
    columns:
      state_id: {gen: sequence}
      state_name: {gen: faker, method: state, null_prob: 0.0}
      state_abbr: {gen: template, format: "S{seq:02d}"}
      state_region: {gen: choice, values: [Northeast, South, Midwest, West], weights: [20, 30, 25, 25], null_prob: 0.05}