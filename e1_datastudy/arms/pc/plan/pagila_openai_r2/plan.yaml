seed: 42
tables:
  country:
    rows: 109
    columns:
      country_id: {gen: sequence}
      country: {gen: faker, method: country}
      last_update: {gen: datetime, start: 2025-01-01 00:00, end: 2026-07-01 23:59}

  city:
    rows: 500
    columns:
      city_id: {gen: sequence}
      city: {gen: faker, method: city}
      country_id: {gen: fk}
      last_update: {gen: datetime, start: 2025-01-01 00:00, end: 2026-07-01 23:59}

  address:
    rows: 500
    columns:
      address_id: {gen: sequence}
      address: {gen: faker, method: street_address}
      address2: {gen: faker, method: secondary_address, null_prob: 0.5}
      district: {gen: faker, method: state}
      city_id: {gen: fk}
      postal_code: {gen: faker, method: postcode}
      phone: {gen: faker, method: phone_number}
      last_update: {gen: datetime, start: 2025-01-01 00:00, end: 2026-07-01 23:59}

  store:
    rows: 2
    columns:
      store_id: {gen: sequence}
      manager_staff_id: {gen: sequence}  # Placeholder, will be updated after staff generation
      address_id: {gen: fk}
      last_update: {gen: datetime, start: 2025-01-01 00:00, end: 2026-07-01 23:59}

  staff:
    rows: 2
    columns:
      staff_id: {gen: sequence}
      first_name: {gen: faker, method: first_name}
      last_name: {gen: faker, method: last_name}
      address_id: {gen: fk}
      email: {gen: faker, method: email, null_prob: 0.2}
      store_id: {gen: fk}
      active: {gen: choice, values: [true, false], weights: [90, 10]}
      username: {gen: faker, method: user_name}
      password: {gen: faker, method: word, null_prob: 0.3}
      last_update: {gen: datetime, start: 2025-01-01 00:00, end: 2026-07-01 23:59}
      picture: {gen: const, value: null}

  actor:
    rows: 200
    columns:
      actor_id: {gen: sequence}
      first_name: {gen: faker, method: first_name}
      last_name: {gen: faker, method: last_name}
      last_update: {gen: datetime, start: 2025-01-01 00:00, end: 2026-07-01 23:59}

  category:
    rows: 16
    columns:
      category_id: {gen: sequence}
      name: {gen: faker, method: word}
      last_update: {gen: datetime, start: 2025-01-01 00:00, end: 2026-07-01 23:59}

  language:
    rows: 6
    columns:
      language_id: {gen: sequence}
      name: {gen: faker, method: word}
      last_update: {gen: datetime, start: 2025-01-01 00:00, end: 2026-07-01 23:59}

  film:
    rows: 500
    columns:
      film_id: {gen: sequence}
      title: {gen: faker, method: sentence}
      description: {gen: faker, method: sentence, null_prob: 0.2}
      release_year: {gen: const, value: 2006}
      language_id: {gen: fk}
      original_language_id: {gen: fk, null_prob: 0.5}
      rental_duration: {gen: int, min: 3, max: 7}
      rental_rate: {gen: choice, values: [0.99, 2.99, 4.99], weights: [30, 40, 30]}
      length: {gen: int, min: 60, max: 180}
      replacement_cost: {gen: float, min: 10.00, max: 30.00, round: 2}
      rating: {gen: choice, values: ['G', 'PG', 'PG-13', 'R', 'NC-17'], weights: [10, 20, 30, 30, 10]}
      last_update: {gen: datetime, start: 2025-01-01 00:00, end: 2026-07-01 23:59}
      special_features: {gen: faker, method: sentence, null_prob: 0.3}

  film_actor:
    rows: 500
    columns:
      actor_id: {gen: fk}
      film_id: {gen: fk}
      last_update: {gen: datetime, start: 2025-01-01 00:00, end: 2026-07-01 23:59}

  film_category:
    rows: 500
    columns:
      film_id: {gen: fk}
      category_id: {gen: fk}
      last_update: {gen: datetime, start: 2025-01-01 00:00, end: 2026-07-01 23:59}

  inventory:
    rows: 500
    columns:
      inventory_id: {gen: sequence}
      film_id: {gen: fk}
      store_id: {gen: fk}
      last_update: {gen: datetime, start: 2025-01-01 00:00, end: 2026-07-01 23:59}

  customer:
    rows: 500
    columns:
      customer_id: {gen: sequence}
      store_id: {gen: fk}
      first_name: {gen: faker, method: first_name}
      last_name: {gen: faker, method: last_name}
      email: {gen: faker, method: email, null_prob: 0.2}
      address_id: {gen: fk}
      activebool: {gen: choice, values: [true, false], weights: [90, 10]}
      create_date: {gen: date, start: 2025-01-01, end: 2026-07-01}
      last_update: {gen: datetime, start: 2025-01-01 00:00, end: 2026-07-01 23:59, null_prob: 0.2}
      active: {gen: choice, values: [1, 0], weights: [90, 10], null_prob: 0.2}

  rental:
    rows: 500
    columns:
      rental_id: {gen: sequence}
      rental_date: {gen: datetime, start: 2025-01-01 00:00, end: 2025-06-01 23:59}
      inventory_id: {gen: fk}
      customer_id: {gen: fk}
      return_date: {gen: expr, code: "row.rental_date + (Math.random() < 0.9 ? 7 : null)"}
      staff_id: {gen: fk}
      last_update: {gen: datetime, start: 2025-01-01 00:00, end: 2026-07-01 23:59}

  payment:
    rows: 500
    columns:
      payment_id: {gen: sequence}
      customer_id: {gen: fk}
      staff_id: {gen: fk}
      rental_id: {gen: fk}
      amount: {gen: choice, values: [0.99, 2.99, 4.99, 5.99, 6.99], weights: [20, 20, 20, 20, 20]}
      payment_date: {gen: datetime, start: 2025-01-01 00:00, end: 2026-07-01 23:59}