seed: 42
tables:
  categories:
    rows: 8
    columns:
      category_id: {gen: sequence}
      category_name: {gen: choice, values: [beverages, condiments, confections, dairy, grains/cereals, meat/poultry, produce, seafood]}
      description: {gen: faker, method: sentence}
      picture: {gen: const, value: null}

  customer_demographics:
    rows: 0
    columns:
      customer_type_id: {gen: sequence}
      customer_desc: {gen: const, value: null}

  customers:
    rows: 91
    columns:
      customer_id: {gen: template, format: "CUST-{seq:03d}"}
      company_name: {gen: faker, method: company}
      contact_name: {gen: faker, method: name, null_prob: 0.2}
      contact_title: {gen: faker, method: job_title, null_prob: 0.2}
      address: {gen: faker, method: street_address, null_prob: 0.1}
      city: {gen: faker, method: city, null_prob: 0.1}
      region: {gen: faker, method: state, null_prob: 0.3}
      postal_code: {gen: faker, method: postcode, null_prob: 0.1}
      country: {gen: choice, values: ["USA", "Canada", "UK", "Germany", "France", "Italy", "Spain", "Mexico", "Brazil", "Argentina"], weights: [10, 10, 10, 10, 10, 10, 10, 10, 10, 10]}
      phone: {gen: faker, method: phone_number}
      fax: {gen: faker, method: phone_number, null_prob: 0.5}

  customer_customer_demo:
    rows: 0
    columns:
      customer_id: {gen: fk, ref: customers.customer_id}
      customer_type_id: {gen: fk, ref: customer_demographics.customer_type_id}

  employees:
    rows: 9
    columns:
      employee_id: {gen: sequence}
      last_name: {gen: faker, method: last_name}
      first_name: {gen: faker, method: first_name}
      title: {gen: faker, method: job_title, null_prob: 0.1}
      title_of_courtesy: {gen: choice, values: ["Mr.", "Ms.", "Mrs.", "Dr."], null_prob: 0.1}
      birth_date: {gen: date, start: 1960-01-01, end: 1990-12-31}
      hire_date: {gen: date, start: 2010-01-01, end: 2020-12-31}
      address: {gen: faker, method: street_address}
      city: {gen: faker, method: city}
      region: {gen: faker, method: state, null_prob: 0.3}
      postal_code: {gen: faker, method: postcode}
      country: {gen: const, value: "USA"}
      home_phone: {gen: faker, method: phone_number}
      extension: {gen: template, format: "{seq:04d}"}
      photo: {gen: const, value: null}
      notes: {gen: faker, method: sentence, null_prob: 0.2}
      reports_to: {gen: fk, null_prob: 0.8}
      photo_path: {gen: const, value: null}

  region:
    rows: 4
    columns:
      region_id: {gen: sequence}
      region_description: {gen: choice, values: ["North", "South", "East", "West"]}

  territories:
    rows: 53
    columns:
      territory_id: {gen: template, format: "TERR-{seq:03d}"}
      territory_description: {gen: faker, method: sentence}
      region_id: {gen: fk}

  employee_territories:
    rows: 49
    columns:
      employee_id: {gen: fk}
      territory_id: {gen: fk}

  shippers:
    rows: 6
    columns:
      shipper_id: {gen: sequence}
      company_name: {gen: faker, method: company}
      phone: {gen: faker, method: phone_number}

  orders:
    rows: 500
    columns:
      order_id: {gen: sequence}
      customer_id: {gen: fk}
      employee_id: {gen: fk}
      order_date: {gen: date, start: 2025-01-01, end: 2025-12-31}
      required_date: {gen: expr, code: "new Date(row.order_date.getTime() + 7*24*60*60*1000)"}
      shipped_date: {gen: expr, code: "new Date(row.order_date.getTime() + 3*24*60*60*1000)", null_prob: 0.1}
      ship_via: {gen: fk}
      freight: {gen: float, min: 10, max: 100, round: 2}
      ship_name: {gen: faker, method: company}
      ship_address: {gen: faker, method: street_address}
      ship_city: {gen: faker, method: city}
      ship_region: {gen: faker, method: state, null_prob: 0.3}
      ship_postal_code: {gen: faker, method: postcode}
      ship_country: {gen: const, value: "USA"}

  suppliers:
    rows: 29
    columns:
      supplier_id: {gen: sequence}
      company_name: {gen: faker, method: company}
      contact_name: {gen: faker, method: name, null_prob: 0.2}
      contact_title: {gen: faker, method: job_title, null_prob: 0.2}
      address: {gen: faker, method: street_address}
      city: {gen: faker, method: city}
      region: {gen: faker, method: state, null_prob: 0.3}
      postal_code: {gen: faker, method: postcode}
      country: {gen: const, value: "USA"}
      phone: {gen: faker, method: phone_number}
      fax: {gen: faker, method: phone_number, null_prob: 0.5}
      homepage: {gen: faker, method: sentence, null_prob: 0.5}

  products:
    rows: 77
    columns:
      product_id: {gen: sequence}
      product_name: {gen: faker, method: word}
      supplier_id: {gen: fk}
      category_id: {gen: fk}
      quantity_per_unit: {gen: template, format: "{seq} units"}
      unit_price: {gen: float, min: 1, max: 100, round: 2}
      units_in_stock: {gen: int, min: 0, max: 100}
      units_on_order: {gen: int, min: 0, max: 50}
      reorder_level: {gen: int, min: 0, max: 20}
      discontinued: {gen: choice, values: [0, 1], weights: [90, 10]}

  order_details:
    rows: 500
    columns:
      order_id: {gen: fk}
      product_id: {gen: fk}
      unit_price: {gen: float, min: 1, max: 100, round: 2}
      quantity: {gen: int, min: 1, max: 10}
      discount: {gen: float, min: 0, max: 0.25, round: 2}

  us_states:
    rows: 51
    columns:
      state_id: {gen: sequence}
      state_name: {gen: faker, method: state}
      state_abbr: {gen: faker, method: state_abbr}
      state_region: {gen: faker, method: word}