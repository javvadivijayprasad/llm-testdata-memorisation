seed: 42
tables:
  artist:
    rows: 275
    columns:
      artist_id: {gen: sequence}
      name: {gen: faker, method: company}

  album:
    rows: 347
    columns:
      album_id: {gen: sequence}
      title: {gen: faker, method: catch_phrase}
      artist_id: {gen: fk, distribution: zipf}

  genre:
    rows: 25
    columns:
      genre_id: {gen: sequence}
      name: {gen: faker, method: word}

  media_type:
    rows: 5
    columns:
      media_type_id: {gen: sequence}
      name: {gen: choice, values: [MPEG audio file, AAC audio file, Protected AAC audio file, Purchased AAC audio file, AAC+DRM video file], weights: [40, 25, 15, 10, 10]}

  employee:
    rows: 8
    columns:
      employee_id: {gen: sequence}
      last_name: {gen: faker, method: last_name}
      first_name: {gen: faker, method: first_name}
      title: {gen: choice, values: [General Manager, Sales Manager, Sales Support Agent, IT Manager, IT Staff], weights: [12, 12, 50, 13, 13]}
      reports_to: {gen: fk, null_prob: 0.13}
      birth_date: {gen: datetime, start: 1950-01-01 00:00, end: 1990-12-31 23:59}
      hire_date: {gen: datetime, start: 2000-01-01 00:00, end: 2010-12-31 23:59}
      address: {gen: faker, method: street_address}
      city: {gen: faker, method: city}
      state: {gen: faker, method: state}
      country: {gen: const, value: Canada}
      postal_code: {gen: faker, method: postcode}
      phone: {gen: faker, method: phone_number}
      fax: {gen: faker, method: phone_number}
      email: {gen: faker, method: email}

  customer:
    rows: 59
    columns:
      customer_id: {gen: sequence}
      first_name: {gen: faker, method: first_name}
      last_name: {gen: faker, method: last_name}
      company: {gen: faker, method: company, null_prob: 0.7}
      address: {gen: faker, method: street_address}
      city: {gen: faker, method: city}
      state: {gen: faker, method: state}
      country: {gen: choice, values: [USA, Canada, Brazil, France, Germany, United Kingdom, Czech Republic, Portugal, India, Australia, Other], weights: [22, 12, 10, 8, 7, 6, 5, 4, 4, 4, 18]}
      postal_code: {gen: faker, method: postcode}
      phone: {gen: faker, method: phone_number}
      fax: {gen: faker, method: phone_number, null_prob: 0.6}
      email: {gen: faker, method: email}
      support_rep_id: {gen: fk, distribution: zipf}

  invoice:
    rows: 412
    columns:
      invoice_id: {gen: sequence}
      customer_id: {gen: fk, distribution: zipf}
      invoice_date: {gen: datetime, start: 2021-01-01 00:00, end: 2024-12-31 23:59}
      billing_address: {gen: faker, method: street_address}
      billing_city: {gen: faker, method: city}
      billing_state: {gen: faker, method: state, null_prob: 0.2}
      billing_country: {gen: faker, method: city}
      billing_postal_code: {gen: faker, method: postcode, null_prob: 0.1}
      total: {gen: float, min: 0.99, max: 25.86, round: 2}

  track:
    rows: 500
    columns:
      track_id: {gen: sequence}
      name: {gen: faker, method: catch_phrase}
      album_id: {gen: fk, null_prob: 0.02}
      media_type_id: {gen: fk, distribution: zipf}
      genre_id: {gen: fk, distribution: zipf, null_prob: 0.02}
      composer: {gen: faker, method: name, null_prob: 0.4}
      milliseconds: {gen: int, min: 120000, max: 360000}
      bytes: {gen: int, min: 2000000, max: 15000000}
      unit_price: {gen: choice, values: [0.99, 1.99], weights: [85, 15]}

  invoice_line:
    rows: 500
    columns:
      invoice_line_id: {gen: sequence}
      invoice_id: {gen: fk, distribution: zipf}
      track_id: {gen: fk, distribution: zipf}
      unit_price: {gen: choice, values: [0.99, 1.99], weights: [85, 15]}
      quantity: {gen: const, value: 1}

  playlist:
    rows: 18
    columns:
      playlist_id: {gen: sequence}
      name: {gen: faker, method: catch_phrase}

  playlist_track:
    rows: 500
    columns:
      playlist_id: {gen: fk, distribution: zipf}
      track_id: {gen: fk, distribution: zipf}